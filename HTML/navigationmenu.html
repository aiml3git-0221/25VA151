<!DOCTYPE html>
<html>
<head>
  <title>NAVIGATION BAR</title>
  <style>
.heading {
    text-align: center;
    background: beige;
    padding: 15px;
    display: block;
}

.navbar {
    background-color: #523d2c;
    padding: 10px;
}
.navbar ul {
    list-style: none;
    margin:0;
}
.navbar li {
    float:left; 
    margin-right: 20px;
}
.navbar a {
    text-decoration: none;
    color: white;
    padding: 8px 12px;
    font-size: 18px;
}
.navbar a:hover {
    background: #7e6148;
    border-radius: 15px;
}
.clear {
    clear: both;
}
</style>
</head>
<body>
  <h1 class="heading"><u>My Website Navigation</u></h1>
    <div class="navbar">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="clear"></div>
    </div>

</body>
</html>
