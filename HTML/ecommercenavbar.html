<!DOCTYPE html>
<html>
<head>
        <title>E-COMMERCE NAVBAR</title>
<style>
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 20px;
    background: #262626;
    color: white;
}
.logo {
    font-size: 24px;
    font-weight: bold;
}
.menu {
    list-style: none;
    display: flex;
    gap: 25px;
}
.menu li a {
    color: white;
    text-decoration: none;
    font-size: 18px;
}
.menu-btn {
    display: none; 
    cursor: pointer;
    font-size: 24px;
}
@media (max-width: 900px) {
    .menu {
        gap: 15px;
    }
}
@media (max-width: 600px) {
    .menu {
        display: none;
    }
    .menu-btn {
        display: block;
    }
}
.menu a:hover{
    background:rgb(73, 66, 66);
    border-radius: 10px;
}
</style>
</head>
<body>
<nav class="navbar">
    <div class="logo"><u>ShopKart</u></div>
    <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Deals</a></li>
            <li><a href="#">Contact</a></li>
    </ul>
</nav>
</body>
</html>
