<!DOCTYPE html>
<html>
<head>
        <title>RESPONSIVE PRODUCT GRID</title>
        <style>
.heading {
    text-align: center;
    padding: 20px;
    font-size: 28px;
}
.product-grid {
    width: 90%;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);   
    gap: 20px;
}
.card {
    background: #f7f4ef;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}
.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
}
@media (max-width: 900px) {
    .product-grid {
        grid-template-columns: repeat(2, 1fr);  
    }
}
@media (max-width: 600px) {
    .product-grid {
        grid-template-columns: 1fr;   
    }
    .card img {
        height: 150px;
    }
}
</style>
</head>
<body>
    <h1 class="heading"><u>Our Products</u></h1>

    <div class="product-grid">

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpP-oIpAQFjRMw9H7fQjMjhgC-jHIatlENFg&s" alt="Product 1">
            <h3>Product 1</h3>
            <p>₹499</p>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-0Gi81t_BiO3pI8X-tM88ORxagNxDCpwHlA&s" alt="Product 2">
            <h3>Product 2</h3>
            <p>₹799</p>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCSxotmMzRsWN_ou10Zne-fri5V4GqobDrnQ&s" alt="Product 3">
            <h3>Product 3</h3>
            <p>₹999</p>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ2NaRxkMx3aNpoDmPYd0de-FVmmWlcIbEyaw&s" alt="Product 4">
            <h3>Product 4</h3>
            <p>₹1299</p>
        </div>

    </div>

</body>
</html>
